<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#C8202E">
    <title>Soprole · Wholesale Portal</title>
    <style>
        html, body, body > div, #container, #container-uiarea { height: 100%; }
    </style>
    


    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{ "soprole.portal": "./" }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>


<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="soprole.portal"
        data-id="container"
        data-settings='{"id" : "soprole.portal"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
